<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan Travel Helper</title>
    <link rel="stylesheet" href="2css.css">
</head>
<body>
    
    <section id="language-selection">
        <h2 id="lang-select-title-text">言語を選択 / Select Language</h2>
        <label for="interfaceLanguage" id="lang-select-label">アプリの表示言語:</label>
        <select id="interfaceLanguage" onchange="changeInterfaceLanguage(this.value)">
            <option value="ja" selected>日本語 (Japanese)</option>
            <option value="en">英語 (English)</option>
            <option value="zh-CN">中国語 (Chinese Simplified)</option>
            <option value="ko">韓国語 (Korean)</option>
            <option value="fr">フランス語 (French)</option>
            <option value="es">スペイン語 (Spanish)</option>
            <option value="hi">ヒンディー語 (Hindi)</option>
        </select>
    </section>

    <hr>

    <main>
        <section id="translation">
            <h2 id="translation-heading">1. リアルタイム翻訳 / Instant Translation</h2>
            <label for="targetLanguage" id="translation-target-label">翻訳先言語を選択:</label>
            <select id="targetLanguage">
                <option value="ja">日本語 (Japanese)</option>
                <option value="en" selected>英語 (English)</option>
                <option value="zh-CN">中国語 (Chinese Simplified)</option>
                <option value="ko">韓国語 (Korean)</option>
                <option value="fr">フランス語 (French)</option>
                <option value="es">スペイン語 (Spanish)</option>
                <option value="hi">ヒンディー語 (Hindi)</option>
                <option value="ar">アラビア語 (Arabic)</option>
            </select>

            <div class="input-area">
                <textarea id="inputText" placeholder="翻訳したいテキストを入力してください"></textarea>
                <div class="translation-buttons-group">
                    <button onclick="startVoiceInput()" id="voice-input-button">🎤 音声入力</button>
                    <button onclick="translateText()" id="translate-button">テキストを翻訳</button>
                    <button onclick="openCameraTranslation()" id="camera-translate-button">📸 カメラで翻訳</button>
                </div>
                <p class="note" id="voice-status-note" style="color: #d32f2f; margin-top: 5px; display: none; font-weight: bold;"></p>
            </div>
            <p class="note" id="translation-note">※「テキストを翻訳」はGoogle翻訳のウェブサイトを使用します。</p>
        </section>

        <hr>
        <section id="conversation">
            <h2 id="conversation-heading">2. 日常会話を読み上げ</h2>
            <p id="conversation-instruction">聞きたいフレーズをタップしてください。日本語を読み上げます。</p>
            <div id="phrases-container">
                <button class="phrase-button" onclick="speakPhrase('こんにちは')" id="phrase-1">👋 こんにちは (Konnichiwa)</button>
                <button class="phrase-button" onclick="speakPhrase('ありがとう')" id="phrase-2">🙏 ありがとう (Arigatou)</button>
                <button class="phrase-button" onclick="speakPhrase('すみません、いくらですか？')" id="phrase-3">🛍️ すみません、いくらですか？</button>
                <button class="phrase-button" onclick="speakPhrase('トイレはどこですか？')" id="phrase-4">🚻 トイレはどこですか？</button>
                <button class="phrase-button" onclick="speakPhrase('助けてください')" id="phrase-5">🆘 助けてください</button>
            </div>
        </section>

        <hr>
        <section id="learning">
            <h2 id="learning-heading">3. 日本語学習</h2>
            <p id="learning-instruction">基本的な言葉を学んでみましょう。タップで発音を確認できます。</p>
            <h3 id="custom-word-heading">カスタム単語を追加</h3>
            <p id="custom-word-subinstruction">日本語とあなたの国の言語を入力してください。</p>
            <div id="custom-word-input">
                <label for="japanese-input" id="jp-label">日本語:</label>
                <input type="text" id="japanese-input" placeholder="例: お土産">
                <label for="foreign-input" id="foreign-label">あなたの国の言語:</label>
                <input type="text" id="foreign-input" placeholder="例: Souvenir">
                <button onclick="addCustomWord()" id="add-custom-word-button">単語を追加</button>
                <span id="loading-indicator" style="display:none;">検索中...</span>
            </div>
            <div id="words-container">
                <div class="word-card" onclick="speakPhrase('おはようございます')" id="word-1"><strong>おはようございます</strong></div>
                <div class="word-card" onclick="speakPhrase('さようなら')" id="word-2"><strong>さようなら</strong></div>
                <div id="word-3-card" class="word-card" onclick="speakPhrase('はい')"><strong>はい / いいえ</strong></div>
            </div>
            <div id="custom-words-container"></div>
        </section>
    </main>

    <footer><p>&copy; 2025 Japan Travel Helper</p></footer>

        function changeInterfaceLanguage(lang) {
            const t = translations[lang] || translations['ja'];
            document.getElementById('lang-select-title-text').textContent = t['lang-select-title'];
            document.getElementById('lang-select-label').textContent = t['lang-select-label'];
            document.getElementById('translation-heading').textContent = t['translation-heading'];
            document.getElementById('translation-target-label').textContent = t['translation-target-label'];
            document.getElementById('inputText').placeholder = t['inputText-placeholder'];
            document.getElementById('voice-input-button').textContent = t['voice-input-button'];
            document.getElementById('translate-button').textContent = t['translate-button'];
            document.getElementById('camera-translate-button').textContent = t['camera-translate-button'];
            document.getElementById('translation-note').textContent = t['translation-note'];
            document.getElementById('conversation-heading').textContent = t['conversation-heading'];
            document.getElementById('conversation-instruction').textContent = t['conversation-instruction'];
            for(let i=1; i<=5; i++) { document.getElementById(`phrase-${i}`).textContent = t[`phrase-${i}`]; }
            document.getElementById('learning-heading').textContent = t['learning-heading'];
            document.getElementById('learning-instruction').textContent = t['learning-instruction'];
            document.getElementById('custom-word-heading').textContent = t['custom-word-heading'];
            document.getElementById('jp-label').textContent = t['jp-label'];
            document.getElementById('foreign-label').textContent = t['foreign-label'];
            document.getElementById('add-custom-word-button').textContent = t['add-custom-word-button'];
            document.getElementById('word-1').innerHTML = t['word-1'];
            document.getElementById('word-2').innerHTML = t['word-2'];
            document.getElementById('word-3-card').innerHTML = t['word-3'];
        }

        function translateText(auto = false) {
            const text = document.getElementById('inputText').value.trim();
            const target = document.getElementById('targetLanguage').value;
            const currentLang = document.getElementById('interfaceLanguage').value;
            if(!text) { if(!auto) alert(translations[currentLang]['alert-text']); return; }
            const url = `https://translate.google.com/?sl=auto&tl=${target}&text=${encodeURIComponent(text)}&op=translate`;
            window.open(url, '_blank');
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.onstart = () => {
                const currentLang = document.getElementById('interfaceLanguage').value;
                const statusArea = document.getElementById('voice-status-note');
                statusArea.textContent = translations[currentLang]['voice-status-start'];
                statusArea.style.display = 'block';
                document.getElementById('voice-input-button').classList.add('recording'); 
            };
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('inputText').value = transcript;
                translateText(true);
            };
            recognition.onerror = (event) => {
                const currentLang = document.getElementById('interfaceLanguage').value;
                alert(translations[currentLang]['voice-status-error']);
            };
            recognition.onend = () => {
                document.getElementById('voice-status-note').style.display = 'none';
                document.getElementById('voice-input-button').classList.remove('recording');
            };
        }

        function startVoiceInput() {
            if (!recognition) {
                const currentLang = document.getElementById('interfaceLanguage').value;
                alert(translations[currentLang]['voice-unsupported']);
                return;
            }
            const langMap = {'ja':'ja-JP','en':'en-US','zh-CN':'zh-CN','ko':'ko-KR','fr':'fr-FR','es':'es-ES','hi':'hi-IN'};
            recognition.lang = langMap[document.getElementById('interfaceLanguage').value] || 'ja-JP';
            try { recognition.start(); } catch (e) { recognition.stop(); }
        }

        function openCameraTranslation() {
            const target = document.getElementById('targetLanguage').value;
            const appUrl = `googletranslate://camera?sl=auto&tl=${target}`;
            const webUrl = `https://translate.google.com/#view=image&sl=auto&tl=${target}`; 
            window.open(appUrl, '_top');
            setTimeout(() => {
                if (document.hasFocus()) { window.open(webUrl, '_blank'); }
            }, 1500);
        }

        function speakPhrase(text) {
            window.speechSynthesis.cancel();
            const ut = new SpeechSynthesisUtterance(text);
            ut.lang = 'ja-JP';
            window.speechSynthesis.speak(ut);
        }

        function addCustomWord() {
            const jpInput = document.getElementById('japanese-input');
            const foreignInput = document.getElementById('foreign-input');
            const container = document.getElementById('custom-words-container');
            if(!jpInput.value || !foreignInput.value) return;
            const card = document.createElement('div');
            card.className = 'word-card';
            card.onclick = () => speakPhrase(jpInput.value);
            card.innerHTML = `<strong>${jpInput.value}</strong> (${foreignInput.value})`;
            container.prepend(card);
            jpInput.value = '';
            foreignInput.value = '';
        }

        document.addEventListener('DOMContentLoaded', () => changeInterfaceLanguage('ja'));
    </script>
