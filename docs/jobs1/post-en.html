<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Posting Request</title>
  <link rel="stylesheet" href="post.css">
  <link rel="stylesheet" href="../assets/common.css">
</head>
<body>
  <div id="common-header"></div>
  <script>
    fetch("../assets-en/header.html")
      .then(res => res.text())
      .then(html => {
        const headerContainer = document.getElementById("common-header");
        headerContainer.innerHTML = html;

      });
  </script>
<div class="translate-box">
  <div class="translate-text">
    <p>This page is in English. Please click the button on the right for the Japanese version.</p>
    <p>このページは英語ページです。日本語ページは右のボタンを押してください。</p>
  </div>
  <button onclick="location.href='post.html'">🌐 日本語版</button>
</div>
  <main>
    <h1 class="maintext">📝 Submit a Job Posting Request</h1>
    <form class="post-request" id="job-form">
      <!-- Region -->
      <label for="region-area">Region <span style="color: red;">*</span></label>
      <select id="region-area" required>
        <option value="">Please select</option>
        <option value="Hokkaido/Tohoku">Hokkaido/Tohoku</option>
        <option value="Kanto">Kanto</option>
        <option value="Chubu">Chubu</option>
        <option value="Kinki">Kinki</option>
        <option value="Chugoku">Chugoku</option>
        <option value="Shikoku">Shikoku</option>
        <option value="Kyushu/Okinawa">Kyushu/Okinawa</option>
      </select>

      <label for="region-pref">Prefecture <span style="color: red;">*</span></label>
      <select id="region-pref" required>
        <option value="">Please select a region first</option>
      </select>

      <!-- Job Type -->
      <label for="job-type">Job Category <span style="color: red;">*</span></label>
      <select id="job-type" required>
        <option value="">Please select</option>
        <option value="Ryokan/Hotel Staff">Ryokan/Hotel Staff</option>
        <option value="Tourist Info/Reception">Tourist Info/Reception</option>
        <option value="Souvenir Sales">Souvenir Sales</option>
        <option value="Restaurant Staff">Restaurant Staff</option>
        <option value="Ski Resort Staff">Ski Resort Staff</option>
        <option value="Guide/Experience Support">Guide/Experience Support</option>
        <option value="Other">Other</option>
      </select>
      <label for="job-type-other" id="label-job-type-other" style="display: none;">Please specify <span id="asterisk-job-type-other" style="color: red; display: none;">*</span></label>
      <input type="text" id="job-type-other" placeholder="Please specify" style="display: none;">

      <!-- Hourly Wage -->
      <label for="job-wage">Estimated Hourly Wage (within ±500 yen) <span style="color: red;">*</span></label>
      <select id="job-wage" required>
        <option value="">Please select</option>
        <option value="1000">1,000 yen</option>
        <option value="2000">2,000 yen</option>
        <option value="3000">3,000 yen</option>
        <option value="4000">4,000 yen</option>
        <option value="4000up">Over 4,000 yen</option>
        <option value="Other">Other conditions</option>
      </select>
      <label for="job-wage-other" id="label-job-wage-other" style="display: none;">Please specify <span id="asterisk-job-wage-other" style="color: red; display: none;">*</span></label>
      <input type="text" id="job-wage-other" placeholder="Please specify" style="display: none;">

      <!-- Recruitment Hours -->
      <label for="job-hours-start">Recruitment Hours <span style="color: red;">*</span></label>
      <div class="job-hours-row" style="display:flex;align-items:center;gap:0.5rem;">
        <select id="job-hours-start" required style="width:160px;">
          <option value="">Select</option>
          <!-- options will be populated by JS -->
        </select>
        <span class="tilde">～</span>
        <select id="job-hours-end" required style="width:160px;">
          <option value="">Select</option>
          <!-- options will be populated by JS -->
        </select>
      </div>

      <!-- Facility Name -->
      <label for="facility">Facility/Store Name <span style="color: red;">*</span></label>
      <input type="text" id="facility" placeholder="e.g., Yunonosato Ryokan" required>

      <!-- Address -->
      <label for="address">Address (below prefecture) <span style="color: red;">*</span></label>
      <input type="text" id="address" placeholder="e.g., 3-10-5 Asama Onsen, Matsumoto City" required>

      <!-- Contact -->
      <label for="contact">Contact Number <span style="color: red;">*</span></label>
      <input type="text" id="contact" placeholder="e.g., 09012345678" required>

      <!-- Website (optional) -->
      <label for="website">Website (optional)</label>
      <input type="url" id="website" placeholder="e.g., https://example.com">

      <!-- Additional Comments (optional) -->
      <label for="description">Additional Comments (optional)</label>
      <textarea id="description" rows="4"></textarea>

      <button type="submit">Submit Request</button>
    </form>
  </main>

  <div id="common-footer"></div>
  <script>
    fetch("../assets-en/footer.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("common-footer").innerHTML = html;
      });
  </script>
  <script src="../assets-en/common.js" defer></script>
  <script src="post.js" defer></script>
</body>
</html>
