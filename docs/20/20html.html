    <main>
        <section class="nav-container">
            <a href="mana.html" class="big-btn btn-manner">
                <i class="fa-solid fa-utensils"></i>
                <h2 id="btn-manner">日本のマナー</h2>

        <section class="details-section">
            <div class="detail-card detail-manner">
                <h3 id="manner-title">マナーガイドについて</h3>

                    日本独特の礼儀作法や、生活のマナーについて詳しく解説します。
                    <ul class="detail-list">
                        <li id="manner-list-1">食事の挨拶</li>

                        <li id="manner-list-4">靴を脱ぐ場所</li>
                        <li id="manner-list-5">電車での過ごし方</li>
                        <li id="manner-list-6">賽銭のやり方</li>
                    </ul>
                </p>
                </div>

            <div class="detail-card detail-travel">
                 <h3 id="travel-title">観光ガイドについて</h3>
                <p class="detail-text" id="travel-desc">
                    有名な観光地から、地元の人しか知らない穴場スポットまで紹介します。
                    <ul class="detail-list">
                    <li id="travel-list-1">都道府県ごとのおすすめスポット</li>
                    <li id="travel-list-2">ジャンルごとのおすすめスポット</li>
