<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAPAN CULTURE TOP</title>
    
    <link rel="stylesheet" href="20css.css">
    <link rel="stylesheet" href="../assets-en/common.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div id="common-header"></div>
<script>
  fetch("../assets-en/header.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("common-header").innerHTML = html;
    });
</script>

<header1>
    <h1 class="site-title" id="title">JAPAN CULTURE TOP</h1>
    <button id="lang-btn" class="lang-btn">日本語</button>
</header1>

<main>
    <section class="nav-container">
        <a href="mana.html?lang=en" class="big-btn btn-manner">
            <i class="fa-solid fa-utensils"></i>
            <h2 id="btn-manner">Manner Guide</h2>
        </a>

        <a href="kankou.html?lang=en" class="big-btn btn-travel">
            <i class="fa-solid fa-torii-gate"></i>
            <h2 id="btn-travel">Travel Guide</h2>
        </a>
    </section>

    <section class="details-section">
        <div class="detail-card detail-manner">
            <h3 id="manner-title">About Manner Guide</h3>
            <p class="detail-text" id="manner-desc">Learn about Japanese unique etiquette and daily manners.</p>
        </div>

        <div class="detail-card detail-travel">
            <h3 id="travel-title">About Travel Guide</h3>
            <p class="detail-text" id="travel-desc">Introducing famous tourist spots and local hidden gems.</p>
        </div>
    </section>
</main>

<script src="../assets-en/common.js" defer></script>
<script src="lang-switch.js"></script>
<script>
// Ensure page shows English if navigated here directly
if (typeof currentLang !== 'undefined') {
    currentLang = 'en';
    if (typeof updateText === 'function') updateText();
}
</script>

<div id="common-footer"></div>
<script>
  fetch("../assets-en/footer.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("common-footer").innerHTML = html;
    });
</script>

</html>
