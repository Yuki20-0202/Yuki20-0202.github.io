<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>検索結果</title>
  <link rel="stylesheet" href="/assets/common.css">
  <link rel="stylesheet" href="/search/search.css">
</head>
<body>
  <div id="common-header"></div>
  <script>
    fetch("/assets/header.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("common-header").innerHTML = html;
      });
  </script>

  <main>
    <div class="search-heading-wrapper">
    <div class="accent-bar"></div>
        <h2 id="search-heading">検索結果</h2>
    </div>
    <div id="filters"></div>
    <div id="results"></div>
  </main>

<script src="/search/search-results.js" defer></script>

  <div id="common-footer"></div>
  <script>
    fetch("/assets/footer.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("common-footer").innerHTML = html;
      });
  </script>
  <script src="/assets/common.js" defer></script>
</body>
</html>
